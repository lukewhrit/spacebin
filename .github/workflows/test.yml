name: Tests and Coverage

on: [push, pull_request]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spacebin
          POSTGRES_PASSWORD: spacebin
          POSTGRES_DB: spacebin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spacebin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: spacebin
          MYSQL_PASSWORD: spacebin
          MYSQL_DATABASE: spacebin
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v4
        with:
          go-version: 1.26
      - name: Run coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
        env:
          SPACEBIN_TEST_POSTGRES: postgres://spacebin:spacebin@localhost:5432/spacebin?sslmode=disable
          SPACEBIN_TEST_MYSQL: mysql://spacebin:spacebin@tcp(localhost:3306)/spacebin
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
