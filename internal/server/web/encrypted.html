<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spacebin</title>

    <meta property="og:title" content="Spacebin: Text sharing for the final frontier" />
    <meta property="og:url" content="spaceb.in" />
    <meta property="og:type" content="website" />
    <meta property="og:description"
        content="A highly-reliable pastebin server, built in Go, that's capable of serving notes, code, or any other documents." />
    <meta name="description"
        content="Spacebin is a highly-reliable pastebin server, built with Go, that's capable of serving notes, code, or any other documents." />
    <meta property="og:color" content="#e34b4a" />

    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/static/normalize.css">
    <link rel="stylesheet" type="text/css" href="/static/global.css">

    {{.Analytics}}

</head>

<body>
    <header>
        <img src="/static/logo.svg" alt="Spacebin Logo" />

        <a id="home" href="/" aria-label="Home">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </a>

        <a id="github" href="https://github.com/lukewhrit/spacebin" aria-label="Spacebin Github">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
            </svg>
        </a>

        <button id="copy" aria-label="Copy Document" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </button>

        <a href="#qr" class="trigger">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <rect x="1" y="1" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" />

                <rect x="3" y="3" width="6" height="6" rx="1" />
                <rect x="5" y="5" width="2" height="2" />

                <rect x="15" y="3" width="6" height="6" rx="1" />
                <rect x="17" y="5" width="2" height="2"/>

                <rect x="3" y="15" width="6" height="6" rx="1" />
                <rect x="5" y="17" width="2" height="2"/>

                <rect x="11" y="3" width="2" height="2" />
                <rect x="13" y="7" width="2" height="2" />
                <rect x="11" y="11" width="2" height="2" />
                <rect x="15" y="11" width="2" height="2" />
                <rect x="9" y="13" width="2" height="2" />
                <rect x="13" y="15" width="2" height="2" />
                <rect x="17" y="15" width="2" height="2" />
                <rect x="11" y="19" width="2" height="2" />
                <rect x="15" y="19" width="2" height="2" />
            </svg>
        </a>

        {{if eq .AccountsEnabled true}}
        <div id="authentication">
            {{if eq .Authenticated true }}
            <a id="user-btn" href="/account" aria-label="Account Settings">
                {{.Username}}
            </a>
            {{else}}
            <a id="signin-btn" href="/signin" aria-label="Sign In">
                Sign In
            </a>
            <a id="signup-btn" href="/signup" aria-label="Sign Up">
                Sign Up
            </a>
            {{end}}
        </div>
        {{end}}

        {{if eq .IsOwner true}}
        <form method="post" action="/{{.ID}}/delete" style="display:inline" enctype="multipart/form-data"
            onsubmit="return confirm('Delete this document?')" id="delete-btn-form">
            <button aria-label="Delete document" class="delete-btn" type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
            </button>
        </form>
        {{end}}
    </header>

    <div id="qr" class="modal">
        <div class="modal-content">
            <p>QR Code</p>
            <img src="/{{ .ID }}/qr" alt="QR Code" width="265" height="265">
            <br><br>
            <a href="#">Close</a>
        </div>
    </div>

    <main id="encrypted" data-envelope="{{.Envelope}}">
        <div id="form">
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                Encrypted Document
            </h1>

            <noscript>
                <p id="warning">Decrypting this document needs JavaScript. Its password never leaves your browser.</p>
            </noscript>

            <form id="decrypt-form" hidden>
                <label for="decrypt-password">Password</label><br>
                <input type="password" id="decrypt-password" autocomplete="current-password" required autofocus><br>
                <p id="decrypt-error" hidden></p>
                <input type="submit" value="Decrypt">
            </form>
        </div>

        <pre id="decrypted" hidden><code></code></pre>
    </main>

    <footer>
        <p id="donate-long">
            Keep Spacebin free of ads by
            <a id="donate-link" href="https://github.com/sponsors/lukewhrit" aria-label="Donate to Spacebin"
                target="_blank">donating.</a>
            💕
        </p>

        <p id="donate-short">
            <a id="short-donate-link" href="https://github.com/sponsors/lukewhrit" aria-label="Donate to Spacebin"
                target="_blank">Donate 💕</a>
        </p>
    </footer>
    <script src="/static/crypto.js"></script>
    <script src="/static/app.js"></script>
</body>

</html>
